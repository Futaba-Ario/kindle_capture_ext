<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 10px;
      font-family: sans-serif;
    }

    button {
      width: 100%;
      padding: 8px;
      margin-bottom: 5px;
      cursor: pointer;
    }

    .status {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }

    .mode-group {
      margin-bottom: 8px;
    }

    .field-disabled {
      opacity: 0.6;
    }
  </style>
</head>

<body>
  <h3>Kindle Capture</h3>
  <button id="btn-capture-one">1枚だけ撮る (PoC)</button>
  <button id="btn-turn-page">ページ送りテスト (PoC)</button>
  <hr>
  <div class="mode-group">
    <label><input type="radio" name="capture-mode" value="auto" checked> ページ数を自動取得</label><br>
    <label><input type="radio" name="capture-mode" value="manual"> ページ数を手動入力</label>
  </div>
  <label id="manual-pages-label" class="field-disabled">撮影ページ数: <input type="number" id="input-pages" value="10" min="1" style="width: 50px;" disabled></label><br>
  <label>待機(ms): <input type="number" id="input-wait" value="1500" min="0" style="width: 50px;"></label><br>
  <label>分割(頁): <input type="number" id="input-split" value="0" min="0" style="width: 50px;" title="0で分割なし"></label>
  <div style="display: flex; gap: 5px; margin-top: 5px;">
    <button id="btn-start-loop" style="background-color: #e7f3fe;">開始 (PDF)</button>
    <button id="btn-stop" style="background-color: #fee;">停止</button>
  </div>
  <div id="status" class="status"
    style="white-space: pre-wrap; margin-top: 10px; border-top: 1px solid #ccc; padding-top: 5px;">Ready</div>
  <script src="popup.js"></script>
</body>

</html>
